<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
// Escena de ejemplo. El contrato con render.mjs es mínimo:
//   window.setup({ width, height, fps, totalFrames })  -> se llama una vez
//   window.renderFrame(frame, time)                     -> pinta UN fotograma
// No se usa requestAnimationFrame ni Date.now(): el tiempo lo dicta el
// bucle externo, así que el resultado es determinista y no depende de
// lo rápido que vaya la máquina.

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W, H, FPS, TOTAL;

// PRNG con semilla para que las partículas sean idénticas en cada render.
function mulberry32(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let particles = [];

window.setup = ({ width, height, fps, totalFrames }) => {
  W = width; H = height; FPS = fps; TOTAL = totalFrames;
  canvas.width = W; canvas.height = H;
  const rand = mulberry32(42);
  particles = Array.from({ length: 220 }, () => ({
    r: 40 + rand() * Math.min(W, H) * 0.45,   // radio orbital
    a: rand() * Math.PI * 2,                  // ángulo inicial
    w: (0.2 + rand() * 0.8) * (rand() < 0.5 ? -1 : 1), // vel. angular (rad/s)
    s: 1 + rand() * 3,                        // tamaño
    h: rand() * 360,                          // tono
  }));
};

window.renderFrame = (frame, time) => {
  const progress = TOTAL > 1 ? frame / (TOTAL - 1) : 0;
  const cx = W / 2, cy = H / 2;

  // Fondo con degradado que rota lentamente.
  const g = ctx.createLinearGradient(
    cx + Math.cos(time * 0.3) * W, cy + Math.sin(time * 0.3) * H,
    cx - Math.cos(time * 0.3) * W, cy - Math.sin(time * 0.3) * H);
  g.addColorStop(0, '#0b1026');
  g.addColorStop(1, '#2a0b3a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Partículas en órbita.
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    const ang = p.a + p.w * time;
    const wobble = 1 + 0.08 * Math.sin(time * 2 + p.a * 3);
    const x = cx + Math.cos(ang) * p.r * wobble;
    const y = cy + Math.sin(ang) * p.r * wobble * 0.6;
    ctx.fillStyle = `hsla(${(p.h + time * 40) % 360}, 90%, 60%, 0.8)`;
    ctx.beginPath();
    ctx.arc(x, y, p.s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  // Núcleo pulsante.
  const pulse = 30 + 10 * Math.sin(time * Math.PI * 2);
  const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, pulse * 2);
  core.addColorStop(0, 'rgba(255,255,255,1)');
  core.addColorStop(0.4, 'rgba(255,200,120,0.6)');
  core.addColorStop(1, 'rgba(255,120,60,0)');
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.arc(cx, cy, pulse * 2, 0, Math.PI * 2);
  ctx.fill();

  // HUD: contador de fotogramas y barra de progreso.
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = '600 20px monospace';
  ctx.fillText(`frame ${String(frame).padStart(4, '0')}  t=${time.toFixed(3)}s`, 20, 34);
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(20, H - 30, W - 40, 6);
  ctx.fillStyle = '#ffb46b';
  ctx.fillRect(20, H - 30, (W - 40) * progress, 6);
};
</script>
</body>
</html>
